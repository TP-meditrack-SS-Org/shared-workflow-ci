name: Reusable Node CI

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version used by the job
        required: false
        type: string
        default: "20"
      working-directory:
        description: Directory where npm commands are executed
        required: false
        type: string
        default: "."
      install-command:
        description: Command used to install dependencies
        required: false
        type: string
        default: "npm ci"
      lint-command:
        description: Command used to lint the project
        required: false
        type: string
        default: ""
      test-command:
        description: Command used to run the test suite
        required: false
        type: string
        default: ""
      build-command:
        description: Command used to build the project
        required: false
        type: string
        default: ""

jobs:
  ci:
    name: Lint, test and build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install dependencies
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.install-command }}

      - name: Lint
        if: ${{ inputs.lint-command != '' }}
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.lint-command }}

      - name: Test
        if: ${{ inputs.test-command != '' }}
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.test-command }}

      - name: Build
        if: ${{ inputs.build-command != '' }}
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.build-command }}
