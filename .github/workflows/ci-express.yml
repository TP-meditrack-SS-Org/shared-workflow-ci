name: Shared Node Setup

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: "20"
      test-command:
        required: false
        type: string
        default: "npm test"

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: ${{ inputs.test-command }}
